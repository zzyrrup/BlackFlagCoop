name: offline-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-audit:
    name: Static build audit and recorder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recorder unit tests
        run: python3 -m unittest discover -s tools/build_validation_test -v
      - name: Audit this checkout
        run: python3 scripts/audit_cmake_surface.py --repo .
